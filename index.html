<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookHub — Letlotlo Hlaoli's library</title>
    <meta
      name="description"
      content="The books and articles in Letlotlo Hlaoli's Zotero library, organised by folder and subject, with covers, summaries and Turabian citations."
    />
    <meta name="theme-color" content="#0f2a44" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f2a44'/><text x='50%25' y='58%25' text-anchor='middle' dominant-baseline='middle' font-size='34'>📚</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero-inner">
        <a class="back" href="https://hlaolil.github.io/wdd130/"
          >← Letlotlo Hlaoli</a
        >
        <h1>BookHub</h1>
        <p>
          My Zotero library, sorted into my dissertation, exam, coursework and
          teaching folders.
        </p>
        <div class="toolbar" id="shelf-toolbar">
          <label class="search">
            <span class="sr-only">Search books</span>
            <input
              id="search"
              type="search"
              placeholder="Search title, author, subject, summary…"
              autocomplete="off"
            />
          </label>
          <label
            >Sort
            <select id="sort">
              <option value="title">Title A–Z</option>
              <option value="author">Author A–Z</option>
              <option value="newest">Newest published</option>
              <option value="oldest">Oldest published</option>
              <option value="added">Recently added</option>
            </select>
          </label>
          <label
            >Folder
            <select id="folder">
              <option value="">Whole library</option>
            </select>
          </label>
          <label
            >Subject
            <select id="tag">
              <option value="">All subjects</option>
            </select>
          </label>
        </div>
        <div
          class="chips status-chips"
          id="status-chips"
          role="radiogroup"
          aria-label="Reading status"
        >
          <button type="button" data-status="" aria-pressed="true">All</button>
          <button type="button" data-status="★ Key source" aria-pressed="false">
            ★ Key sources
          </button>
          <button type="button" data-status="To read" aria-pressed="false">
            To read
          </button>
          <button type="button" data-status="Read" aria-pressed="false">
            Read
          </button>
          <button
            type="button"
            data-status="Cited in dissertation"
            aria-pressed="false"
          >
            Cited
          </button>
        </div>
        <div
          class="chips status-chips"
          id="req-chips"
          role="radiogroup"
          aria-label="Required or recommended"
          hidden
        >
          <button type="button" data-req="" aria-pressed="true">All readings</button>
          <button type="button" data-req="required" aria-pressed="false">Required</button>
          <button type="button" data-req="recommended" aria-pressed="false">Recommended</button>
        </div>
      </div>
    </header>

    <main class="wrap" id="view-shelf">
      <div class="statusbar">
        <p id="status" role="status">Loading your library…</p>
        <button id="refresh" type="button" class="ghost">
          Refresh from Zotero
        </button>
      </div>
      <div id="books" class="grid" aria-live="polite"></div>
    </main>

    <footer>
      <p>
        BookHub by
        <a href="https://hlaolil.github.io/wdd130/">Letlotlo Hlaoli</a> ·
        Library from <a href="https://www.zotero.org">Zotero</a> · Covers from
        <a href="https://openlibrary.org">Open Library</a>
      </p>
    </footer>

    <dialog id="detail" aria-labelledby="d-title">
      <form method="dialog" class="close-row">
        <button class="ghost" aria-label="Close">✕</button>
      </form>
      <div id="detail-body"></div>
    </dialog>
  </body>
</html>
